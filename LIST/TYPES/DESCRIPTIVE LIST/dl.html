<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Descriptive List</h1>
    <!--! dl:- dl is the Descriptive list it is used to write the decription with the list  -->
    <!--todo dt:- dt is the Data is the title of the list    -->
    <!--todo dd:-dd is a Data Description used to write description of the list data  -->

    <dl>
      <dt>Tea</dt>
      <dd>Tea is A Hot Drink</dd>
    </dl>

    <dl>
      <dt>Coffee</dt>
      <dd>Coffee is A Hot Drink</dd>
    </dl>
    <dl>
      <dt>Sprite</dt>
      <dd>Sprite is A Cold Drink</dd>
    </dl>

    <dl>
      <dt>Water</dt>
      <dd>Water is A Cold Drink</dd>
    </dl>
  </body>
</html>
