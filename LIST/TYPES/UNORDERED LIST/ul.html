<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Document</title>

  <body>
    <!--! ul:- ul it is an unordered list which does not fallow any order -->
    <!--todo :- DEFAULT TYPE OF UNORDERED LIST IS DISC(SOLID CIRCLE) BUT WE CAN CHANGE IT DISC TO CIRCLE (HOLLOW CIRCLE) AND SQUARE  -->
    <!--* NOTE:- REVERSE AN ITEMS IN UNORDERDED LIST IS NOT POSSIBLE   -->
    <!--! TYPE OF SUPPORTED TO UNORDERED LIST  -->
    <!--? DISC :- SOLID CIRCLE  -->
    <!--? CIRCLE:- NOT FILLED CIRCLE  -->
    <!--? SOLID CIRCLE:- FILLED CIRCLE  -->
    <!--? SQUARE:- FILLED SQUARE  -->

    <ul type="solid circle">
        <h1>Engineering</h1>
        <li>COMPUTER</li>
        <li>MECHANICAL</li>
        <li>CIVIL</li>
        <li>ELECTRICAL</li>
        <li>ELECTRONICS</li>
        <li>ENVIRONMENTAL</li>
    </ul>
  </body>
