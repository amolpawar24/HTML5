<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Document</title>
  </head>
  <body>
    <!--todo type:- type it is an Attribute which is used to change type of unorderd list means Bullets Type Ex:-DISC,SOLLID CIRCLE,SQUARE,CIRCLE,NONE  -->
    <ul type="Disc">
      <h1>CRICKET KIT</h1>
      <li>Bat</li>
      <li>Ball</li>
      <li>Stump</li>
    </ul>
    <hr />
    <ul type="Solid Circle">
      <h1>Fruits</h1>
      <li>Apple</li>
      <li>Mango</li>
      <li>Sapota</li>
    </ul>

    <hr />
    <ul type="Square">
      <h1>Animals</h1>
      <li>Lion</li>
      <li>Tiger</li>
      <li>Rhino</li>
    </ul>

    <hr />
    <ul type="Circle">
      <h1>ENGG</h1>
      <li>COMPUTER</li>
      <li>MECHANICLA</li>
      <li>CIVIL</li>
    </ul>

    <ul type="none">
      <h1>Sports</h1>
      <li>Cricket</li>
      <li>Football</li>
      <li>Hockey</li>
    </ul>
  </body>
