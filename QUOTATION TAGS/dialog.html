<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--! Dialog Tag  -->
    <!--todo: Used to create a dialog box or modal window -->
    <!--todo: It is typically used to display additional information or prompts to the user -->
    <!--? Attribute: open: Specifies that the dialog is open -->

    <!--? Example 1: Closed dialog -->
    <dialog>
        hi everyone
    </dialog>

    <!--? Example 2: Open dialog -->
    <dialog open="">
        hi everyone
    </dialog>

    <!--? Example 3: Dialog with a form -->
    <dialog open="">
        <form>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name">
            <button type="submit">Submit</button>
        </form>
    </dialog>

</body>
</html>
